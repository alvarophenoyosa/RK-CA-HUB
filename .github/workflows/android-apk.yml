name: Build RK CA HUB Android APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - "assets/**"
      - "www/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create local web directory placeholder
        run: |
          mkdir -p www
          test -f www/index.html || printf '<!doctype html><html><head><meta charset="utf-8"><title>RK CA HUB</title></head><body>RK CA HUB loads from GitHub Pages.</body></html>' > www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply RK monochrome launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          source = Image.new("RGB", (1024, 1024), (0, 0, 0))
          draw = ImageDraw.Draw(source)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 450)
          bounds = draw.textbbox((0, 0), "RK", font=font)
          x = (1024 - (bounds[2] - bounds[0])) // 2 - bounds[0]
          y = (1024 - (bounds[3] - bounds[1])) // 2 - bounds[1]
          draw.text((x, y), "RK", font=font, fill=(255, 255, 255))

          res = Path("android/app/src/main/res")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, px in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          gray = source.convert("L")
          alpha = gray.point(lambda value: max(0, min(255, int((value - 18) * 1.1))))
          bounds = alpha.point(lambda value: 255 if value > 8 else 0).getbbox()
          alpha = alpha.crop(bounds)
          max_w, max_h = 306, 222
          scale = min(max_w / alpha.width, max_h / alpha.height)
          target = (round(alpha.width * scale), round(alpha.height * scale))
          alpha = alpha.resize(target, Image.Resampling.LANCZOS)
          foreground = Image.new("RGBA", (432, 432), (255, 255, 255, 0))
          glyph = Image.new("RGBA", target, (255, 255, 255, 0))
          glyph.putalpha(alpha)
          foreground.alpha_composite(glyph, ((432-target[0])//2, (432-target[1])//2))
          foreground.save(res / "drawable-nodpi/rk_launcher_foreground.png", optimize=True)
          PY
          cat > "$RES/values/rk_launcher_colors.xml" <<'XML'
          <resources>
            <color name="rk_launcher_background">#000000</color>
          </resources>
          XML
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/${name}.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/rk_launcher_background" />
            <foreground android:drawable="@drawable/rk_launcher_foreground" />
          </adaptive-icon>
          XML
          done

      - name: Reuse a consistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rk-ca-hub-android-debug-keystore-v1

      - name: Ensure debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=RK CA HUB,C=PK" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RK-CA-HUB-Android.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK-CA-HUB-Android-APK
          path: RK-CA-HUB-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.sha }}
          name: RK CA HUB Android APK
          body: |
            Android app wrapper for RK CA HUB.

            This APK loads the live study dashboard from GitHub Pages, so website updates appear in the app without reinstalling the APK. An internet connection is required.
          files: RK-CA-HUB-Android.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
